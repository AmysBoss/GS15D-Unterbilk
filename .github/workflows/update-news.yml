name: Update Lorettoviertel News

on:
  schedule:
    # 06:00 UTC daily (≈ 07:00/08:00 Uhr deutsche Zeit, je nach Sommerzeit)
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: News von Google News abrufen und als news.json speichern
        run: |
          python3 - <<'PY'
          import json
          import urllib.request
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone

          url = "https://news.google.com/rss/search?q=Lorettoviertel+D%C3%BCsseldorf&hl=de&gl=DE&ceid=DE:de"
          req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})

          items = []
          try:
              with urllib.request.urlopen(req, timeout=20) as resp:
                  xml_bytes = resp.read()
              root = ET.fromstring(xml_bytes)
              for item in root.findall("./channel/item")[:8]:
                  title = (item.findtext("title") or "").strip()
                  link = (item.findtext("link") or "").strip()
                  pub_date = (item.findtext("pubDate") or "").strip()
                  if title and link:
                      items.append({"title": title, "link": link, "pubDate": pub_date})
          except Exception as e:
              print("Fetch failed:", e)

          data = {
              "updated": datetime.now(timezone.utc).isoformat(),
              "items": items,
          }

          with open("news.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)

          print(f"Wrote {len(items)} items to news.json")
          PY

      - name: Änderungen committen, falls vorhanden
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news.json
          git diff --staged --quiet && echo "Keine Änderungen" || git commit -m "News aktualisiert ($(date -u +%Y-%m-%d))"
          git push
